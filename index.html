<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma collection</title>
<meta name="theme-color" content="#101319">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Collection">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div id="app" class="app">
  <nav id="nav" class="nav" aria-label="Navigation principale"></nav>
  <main id="main" class="main" tabindex="-1"><div class="chargement">Chargement…</div></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="scanner" class="scanner" hidden>
  <div class="scanner-haut">
    <span>Vise le code-barres</span>
    <button type="button" id="scan-fermer" class="btn-texte">Fermer</button>
  </div>
  <div class="scanner-video"><video id="scan-video" playsinline muted></video><div class="scanner-cadre"></div></div>
  <form id="scan-manuel" class="scanner-bas">
    <label for="scan-saisie">Ou saisis le code à la main</label>
    <div class="ligne">
      <input id="scan-saisie" inputmode="numeric" autocomplete="off" placeholder="13 chiffres">
      <button type="submit" class="btn">Valider</button>
    </div>
    <p id="scan-erreur" class="aide"></p>
  </form>
</div>
<script src="vendor/supabase.js"></script>
<script src="config.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
